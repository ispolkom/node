name: yandi_desktop
description: Локальная оболочка демона YANDI, P2 M2, срез 1.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter_webrtc: 1.6.2+hotfix.4
  record: ^6.0.0
  media_kit: ^1.2.6
  media_kit_video: ^1.3.1
  media_kit_libs_linux: ^1.2.1
  qr_flutter: ^4.1.0
  # Гостевой клиент (lib/guest): E2E и подпись списка узлов, чистый Dart (без cryptography_flutter), версии как у телефона
  cryptography: ^2.7.0
  crypto: ^3.0.3
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/support.json
    - assets/bootstrap.json
    - assets/fonts/NotoColorEmoji-LICENSE.txt
    - assets/fonts/LiberationSans-LICENSE.txt
  fonts:
    # Основной шрифт панели: Liberation Sans (лицензия OFL 1.1), с курсивом и жирным. Tahoma на Linux нет, а подставляемый DejaVu даёт широкие промежутки и пробелы.
    - family: YandiSans
      fonts:
        - asset: assets/fonts/LiberationSans-Regular.ttf
        - asset: assets/fonts/LiberationSans-Italic.ttf
          style: italic
        - asset: assets/fonts/LiberationSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/LiberationSans-BoldItalic.ttf
          weight: 700
          style: italic
    # Цветные эмодзи как на телефоне (Noto Color Emoji, лицензия OFL 1.1): системного шрифта на ПК может не быть.
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf
