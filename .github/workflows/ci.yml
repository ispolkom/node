name: ci
on: [push, pull_request]
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # встроенная сборка libopus использует старую запись CMake; новые версии CMake требуют этого флага
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4
      - name: system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: spawn discipline
        if: runner.os == 'Linux'
        run: scripts/check_spawn.sh
      - name: bundled web audio contracts
        if: runner.os == 'Linux'
        run: |
          node scripts/check_web_audio.cjs
          node scripts/check_phone_call_delivery.cjs
      - run: cargo build --all-targets
      # проверки считают общие счётчики (KDF и др.): тесты библиотеки идут по одному
      - run: cargo test --no-fail-fast -- --test-threads=1
  network:
    runs-on: ubuntu-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4
      - name: system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: network tests on real node processes
        run: |
          cargo test --test testnet_test -- --ignored
          cargo test --test testnet_comms_test -- --ignored
          cargo test --test testnet_rekey_test -- --ignored
          cargo test --test admin_cli_test -- --ignored
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit cargo-deny --locked
      - run: cargo audit
      - run: cargo deny check

  android-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true
      - name: flutter pub get (создаёт android/local.properties)
        working-directory: mobile/yandi_mobile
        run: flutter pub get
      - name: verify release signing guard
        working-directory: mobile/yandi_mobile/android
        run: ./gradlew :app:verifyReleaseSigning --no-daemon

  desktop-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: desktop build libraries
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true
      - name: desktop dependencies
        working-directory: desktop/yandi_desktop
        run: flutter pub get
      - name: desktop audio and notification tests
        working-directory: desktop/yandi_desktop
        run: flutter test --no-pub test/audio_alerts_test.dart test/preferences_test.dart test/background_alerts_test.dart test/calls_test.dart test/call_delivery_test.dart test/calls_api_test.dart test/groups_test.dart test/media_player_test.dart
      - name: native desktop release build
        working-directory: desktop/yandi_desktop
        run: flutter build linux --release --no-pub
      - name: mobile dependencies
        working-directory: mobile/yandi_mobile
        run: flutter pub get
      - name: mobile audio and group event tests
        working-directory: mobile/yandi_mobile
        run: flutter test --no-pub test/app_sounds_test.dart test/call_collision_test.dart test/call_delivery_test.dart test/call_wire_delivery_test.dart test/replay_priority_test.dart test/bug_r13_ledger_notification_test.dart test/ws_live_flood_test.dart test/e2e_security_test.dart test/group_service_test.dart
