plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.yandi.yandi_mobile"
    compileSdk 36
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.yandi.yandi_mobile"
        minSdkVersion flutter.minSdkVersion
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true
        externalNativeBuild {
            cmake {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }

    // Release must never silently fall back to the debug keystore. CI should
    // provide these through environment variables or Gradle properties:
    // YANDI_RELEASE_STORE_FILE, YANDI_RELEASE_STORE_PASSWORD,
    // YANDI_RELEASE_KEY_ALIAS and YANDI_RELEASE_KEY_PASSWORD.
    def releaseStoreFile = System.getenv('YANDI_RELEASE_STORE_FILE') ?: project.findProperty('yandiReleaseStoreFile')
    def releaseStorePassword = System.getenv('YANDI_RELEASE_STORE_PASSWORD') ?: project.findProperty('yandiReleaseStorePassword')
    def releaseKeyAlias = System.getenv('YANDI_RELEASE_KEY_ALIAS') ?: project.findProperty('yandiReleaseKeyAlias')
    def releaseKeyPassword = System.getenv('YANDI_RELEASE_KEY_PASSWORD') ?: project.findProperty('yandiReleaseKeyPassword')
    def releaseSigningConfigured = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    // полный туннель: hev-socks5-tunnel (MIT), см. src/main/jni
    externalNativeBuild {
        cmake {
            path file('src/main/jni/CMakeLists.txt')
        }
    }

    buildTypes {
        release {
            // An unconfigured release is intentionally unsigned instead of
            // accidentally using the public debug key.
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

// CI/local guard: release must remain tied to the dedicated release config.
// Whether that config has real credentials is checked separately by signingReport.
tasks.register("verifyReleaseSigning") {
    doLast {
        def releaseConfig = android.buildTypes.release.signingConfig
        if (releaseConfig == null || releaseConfig.name != "release") {
            throw new GradleException("Release must use signingConfigs.release, never the debug keystore")
        }
        println("Release signing config guard passed: ${releaseConfig.name}")
    }
}
