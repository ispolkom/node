name: yandi_mobile
description: YANDI Mobile — decentralized P2P messenger
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Storage
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Networking
  http: ^1.2.2
  web_socket_channel: ^3.0.1

  # Crypto
  cryptography: ^2.7.0
  crypto: ^3.0.3

  # UI / QR
  mobile_scanner: ^5.2.3
  cupertino_icons: ^1.0.8

  # Media / Audio
  audioplayers: ^6.4.0

  # Notifications (без Firebase/Google)
  flutter_local_notifications: ^17.2.4

  # Background tasks
  workmanager: ^0.5.2

  # File transfer
  file_picker: ^8.1.2

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
